resources:
  jobs:
    wf_test:
      name: WF_TEST
      tasks:
        - task_key: Task_A
          email_notifications: {}
          environment_key: Default
          run_if: ALL_SUCCESS
          spark_python_task:
            python_file: /Workspace/itohub_stage/51_bidw_dev/py/PEC_TABLE_TXN_1.py
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
