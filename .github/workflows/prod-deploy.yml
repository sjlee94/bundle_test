# 워크플로 이름 (GitHub Actions 화면에 표시됨)
name: Prod deployment

# 언제 이 워크플로를 실행할지 정의
on:
  push:
    branches:
      - main          # main 브랜치에 push될 때만 실행 (= PR 머지 시)

# 동시 실행 제어
# → 같은 그룹 이름의 워크플로가 중복 실행되지 않도록 직렬화
concurrency:
  group: prod-deploy
  cancel-in-progress: false   # 진행 중인 배포는 취소하지 않음 (운영 안정성)

jobs:
  deploy-prod:
    name: Deploy bundle to PROD
    runs-on: ubuntu-latest    # GitHub이 제공하는 가상 서버에서 실행

    # 4.4에서 설정할 production 환경 — 수동 승인 게이트 연결
    environment: production

    # Databricks CLI가 인식하는 환경 변수
    # → ${{ secrets.이름 }} 으로 GitHub Secrets에 저장된 값을 가져옴
    # → 4.2에서 등록한 Secret 이름과 정확히 일치해야 함
    env:
      DATABRICKS_HOST:          ${{ secrets.DATABRICKS_HOST_PROD }}
      DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID_PROD }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_PROD }}

    steps:
      # GitHub repo 코드를 가상 서버로 받아오기
      - uses: actions/checkout@v4

      # Databricks CLI 설치
      - uses: databricks/setup-cli@main

      # 1. 기존 단순 배포
      # # YAML 문법 및 설정 검증 (실제 배포 전 안전 체크)
      # - name: Validate bundle
      #   run: databricks bundle validate -t prod

      # # Prod 워크스페이스로 실제 배포
      # - name: Deploy bundle to prod
      #   run: databricks bundle deploy -t prod

      # 2. 배포 + 파일별 업로드/스킵 여부를 명시적으로 출력
      - name: Deploy bundle to prod
        run: |
          # --debug: 파일별 uploading/skipping 명시 로그를 stderr로 출력
          # 2>&1: stderr를 stdout으로 합쳐서 함께 캡처
          # tee deploy.log: 화면에 출력하면서 동시에 deploy.log 파일에 저장
          databricks bundle deploy -t prod --debug 2>&1 | tee deploy.log

          # 빈 줄 (가독성을 위한 구분선)
          echo ""

          # 실제 업로드된 파일 목록 요약
          # grep -i "uploading": 대소문자 무시하고 "uploading" 포함 라인 추출
          # || echo "...": grep 결과가 없으면(업로드 파일 0개) 대체 메시지 출력
          echo "=== 📤 Uploaded files ==="
          grep -i "uploading" deploy.log || echo "  (no file uploads)"

          echo ""

          # 스킵된 파일 개수 카운트
          # grep -ic: 대소문자 무시(-i)하고 매칭된 라인 개수만 반환(-c)
          # || echo "  0": grep 실패 시 0으로 표시
          echo "=== ⏭️ Skipped files (unchanged) ==="
          grep -ic "skipping" deploy.log || echo "  0"

          # CSV 헤더
          echo "timestamp,action,file" > deploy_summary.csv

          # 업로드된 파일들
          while IFS= read -r line; do
            file=$(echo "$line" | awk '{print $NF}')
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),uploaded,$file" >> deploy_summary.csv
          done < <(grep -i "uploading" deploy.log)

          # 스킵된 파일들
          while IFS= read -r line; do
            file=$(echo "$line" | awk '{print $NF}')
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),skipped,$file" >> deploy_summary.csv
          done < <(grep -i "skipping" deploy.log)

      # csv 로그 별도 저장
      - name: Save deploy summary
        uses: actions/upload-artifact@v4
        with:
          name: deploy-summary
          path: |
            deploy.log            # 원본 로그
            deploy_summary.csv    # CSV 요약

      # 상세 로그를 artifact로 저장 (Actions 화면에서 다운로드 가능)
      - name: Save deploy log
        # if: always(): 이전 스텝이 실패해도 로그는 저장 (실패 시 디버깅 용도)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # artifact 이름에 run_number를 붙여 매 실행마다 구분되게 저장
          # 예: deploy-log-1, deploy-log-2, ...
          name: deployment-package-${{ github.run_number }}
          # 저장할 파일 경로 (여러 개 지정 가능)
          # path 아래 라인들을 주석 해제하면 배포 시점의 스냅샷도 함께 저장됨
          # 저장 가능한 파일 형식: 로그(.log/.txt), 설정(.json/.yaml), 스크립트(.py),
          # 데이터(.csv), 이미지(.png), HTML/PDF 등 형식 무관 (GitHub이 자동 ZIP 압축)
          path: |
            deploy.log                    # 배포 로그
            # bundle/databricks.yml       # 배포 시점의 설정 스냅샷
            # bundle/resources/*.yml      # Job 정의 스냅샷
            # bundle/src/*.py             # Python 스크립트 스냅샷
          # 보관 기간 (기본 90일, 여기선 7일로 단축하여 저장 공간 절약)
          retention-days: 7