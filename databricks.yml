# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  # 번들 이름 (Workspace에서 해당 이름으로 폴더 생성됨. 배포 시 식별자로 사용)
  name: "Bundle_Test_Yaml"

# 다른 YAML 파일 자동 포함
# → resources 폴더 안의 모든 yml 파일을 가져와서 합침
# → 하위 폴더(resources/jobs/, resources/pipelines/ 등)까지 포함
# → 파일을 기능별로 나눠서 관리하면 가독성과 유지보수가 쉬워짐
include:
  - resources/*.yml
  - resources/*/*.yml

# 배포 동작 옵션
presets:
  # 소스 연결 배포 모드 (UI 배포 한정 옵션)
  # → true: 파일을 복사하지 않고 Git 폴더의 원본을 직접 바라보고 실행
  #         코드 수정 후 저장만 해도 다음 실행에 즉시 반영됨 (개발 속도 ↑)
  # → false: 매번 Deploy를 눌러야 변경사항 반영됨 (배포 시점이 명확해짐)
  source_linked_deployment: false 

# 모든 환경에서 공통으로 쓰는 변수
# → 각 target에서 값을 덮어써서 환경별로 다른 값 사용 가능
variables:
  py_path_prefix:
    # 변수 설명 (CLI나 UI에서 변수 정보 볼 때 표시됨)
    description: Python path prefix for this target
    # 기본값 (target에서 덮어쓰지 않으면 이 값이 쓰임)
    default: "py_path_prefix"

# 배포 환경(타깃) 정의 — dev / prod 분리
targets:
  # ─────────────────────────────────────────────
  # 개발(dev) 환경 설정
  # ─────────────────────────────────────────────
  dev:
    # 개발 모드로 실행
    # → Job 이름 앞에 [dev 사용자명] 자동으로 붙음 (팀원끼리 안 섞임)
    # → 스케줄이 자동 OFF (실수로 dev에서 정기 실행되는 사고 방지)
    # → 코드 수정 후 저장만 해도 다음 실행에 바로 반영됨 (매번 deploy 안 해도 됨)
    mode: development
    # presets 설정 시 Job 이름 앞에 원하는 명칭으로 설정 가능
    presets:
      name_prefix: "[DEV ${workspace.current_user.short_name}] "

    # 이 환경(dev)을 기본값으로 사용
    # → CLI에서 -t 옵션 없이 deploy 하면 자동으로 dev 환경으로 배포하도록 설정
    default: true

    # 이 환경(dev)에서만 쓸 변수
    variables:
      # Python 스크립트가 모여 있는 폴더 경로
      # → Job 정의에서 ${var.py_path_prefix} 로 가져다 씀
      # → bundle 외부 경로인 경우 절대 경로 가능하나, 내부 경로인 경우는 변수 사용 시 상대 경로로만 가능
      # → Ex. Job Yml 설정 시 ../src/{python_script.py}
      py_path_prefix: /Workspace/itohub_stage/51_bidw_dev/bundle_test/src

    workspace:
      # 배포할 Databricks 워크스페이스 주소
      # → 지금 로그인한 워크스페이스와 일치해야만 UI에서 Deploy 가능
      # → 다른 워크스페이스에 실수로 배포되는 사고를 막아주는 안전장치
      host: https://dbc-37baaae8-f5a0.cloud.databricks.com

      # 배포된 파일이 저장될 폴더
      # → ${bundle.target}: 환경 이름 (예: dev)
      # → ${bundle.name}: 번들 이름
      # → ${workspace.current_user.userName}: 배포한 사람 이메일 (자동 입력)
      # → 결과: 사용자마다 다른 폴더에 저장 → 팀원이 동시에 배포해도 충돌 없음
      root_path: /Workspace/itohub_stage/51_bidw_dev/dab_deploy/${bundle.target}/${bundle.name}/${workspace.current_user.userName}

    # Job을 실행할 계정 지정
    run_as:
      # 배포한 사람의 계정으로 Job 실행 (자동 입력됨)
      # → 누가 배포하든 본인 권한으로 돌아감 (각자 자기 데이터에 접근 가능)
      # → 별도 서비스 계정(SP) 만들 필요 없어서 가볍게 시작 가능
      # → dev에 적합한 패턴 (운영(prod)은 보통 고정된 SP를 사용)
      user_name: ${workspace.current_user.userName}

  # ─────────────────────────────────────────────
  # 운영(prod) 환경 설정
  # ─────────────────────────────────────────────
  prod:
    # 운영 모드로 실행
    # → Job 이름에 prefix 붙지 않음 (실제 운영 이름 그대로)
    # → 검증이 엄격해짐 (Git 브랜치 확인, 사용자 격리 차단 등)
    # → 운영 안정성 보장을 위해 SP(서비스 계정)로 실행 권장
    mode: production

    # 운영 환경 전용 동작 옵션
    presets:
      # 스케줄/트리거를 강제로 활성화
      # → 운영에서는 정기 배치가 정상 작동해야 하므로 항상 ON 상태로 고정
      trigger_pause_status: UNPAUSED

      # 이 환경에서 배포되는 모든 리소스에 자동으로 붙는 태그
      # → 비용 추적, 리소스 식별, 권한 관리 등에 활용
      tags:
        project: 51_bidw_prd_poc

    # 운영 환경 전용 변수 (상단 default 값 덮어씀)
    variables:
      # 운영 Python 스크립트 경로 (dev와 다른 위치)
      # → dev: /itohub_stage/51_bidw_dev/bundle_test/src
      # → prod: /itohub_stage/51_bidw_prd/bundle_test/src
      py_path_prefix: /Workspace/itohub/51_bidw_prd/bundle_test/src

    workspace:
      # 운영 Databricks 워크스페이스 주소
      host: https://dbc-776681e3-3371.cloud.databricks.com/

      # 배포된 파일이 저장될 운영 폴더
      # → 운영도 사용자별로 분리되지만, 실제로는 SP가 배포하므로 단일 위치로 모임
      root_path: /Workspace/itohub/51_bidw_prd/dab_deploy/${bundle.target}/${bundle.name}/${workspace.current_user.userName}

    # Job을 실행할 계정 지정
    run_as:
      # 운영 환경의 서비스 계정(SP)으로 Job 실행
      # → 사람 계정과 분리되어 롤인아웃 영향 없이 안정적으로 운영됨
      # → 감사 로그가 일관되게 기록됨
      # → 권한 최소화 가능 (SP에는 운영에 필요한 권한만 부여)
      # → git action 활용 시 SP 명칭 대신 Application ID로 입력 필요
      # service_principal_name: Prod-Bidw-Poc-1
      service_principal_name: 651e8177-236f-4209-a6e6-e4fd3195c88b